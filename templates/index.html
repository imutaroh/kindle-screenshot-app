<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindle 自動スクショアプリ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Kindle 自動スクショアプリ</h1>
            <div class="status-badge" id="statusBadge">待機中</div>
        </header>

        <main>
            <!-- 入力セクション -->
            <section class="card" id="inputSection">
                <h2>📝 設定</h2>
                
                <div class="form-group">
                    <label for="bookName">本の名前（必須）</label>
                    <input type="text" id="bookName" placeholder="例: プログラミング入門" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="maxPages">最大ページ数</label>
                        <input type="number" id="maxPages" min="0" value="0" placeholder="0 = 無制限">
                        <small>0を入力すると無制限</small>
                    </div>

                    <div class="form-group">
                        <label for="pdfPagesPerFile">PDF結合枚数</label>
                        <input type="number" id="pdfPagesPerFile" min="1" value="100">
                        <small>1つのPDFに含める画像枚数</small>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="autoDeletePng">
                        <span>PDF作成後にPNGを自動削除</span>
                    </label>
                </div>

                <div class="button-group">
                    <button id="startButton" class="btn btn-primary" onclick="startCapture()">
                        🚀 実行開始
                    </button>
                    <button id="stopButton" class="btn btn-danger" onclick="stopCapture()" style="display: none;">
                        ⏹️ 停止
                    </button>
                </div>
            </section>

            <!-- 進捗表示セクション -->
            <section class="card" id="progressSection" style="display: none;">
                <h2>📊 進捗状況</h2>
                
                <div class="progress-info">
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="progress-text">
                        <span id="progressText">0 / 0 ページ</span>
                        <span id="progressPercent">0%</span>
                    </div>
                </div>

                <div class="message-box" id="messageBox">
                    <p id="messageText">準備中...</p>
                </div>
            </section>

            <!-- ログ表示セクション -->
            <section class="card">
                <h2>📋 ログ</h2>
                <div class="log-container" id="logContainer">
                    <p class="log-entry">待機中...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Kindle 自動スクショアプリ v1.0</p>
            <p class="warning">⚠️ 実行前にKindleをフルスクリーンで表示してください</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
